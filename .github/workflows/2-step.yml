name: Step 2

on:
  push:
    branches:
      - "feat/recipe-scaling"

permissions: {}

concurrency:
  group: step-2
  cancel-in-progress: true

env:
  STEP_3_FILE: ".github/steps/3-step.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    # Creating the branch also fires a push; grade only once a commit lands on it
    if: github.event.created == false
    permissions:
      issues: read # locate the exercise issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    permissions:
      contents: read # read branches and files through the API
      issues: write # post and update the feedback comment
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: "github-actions[bot]"
          body-includes: "watch your progress in the background"
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      # START: Check practical exercise

      - name: Check recipe.py exists on feat/recipe-model
        id: check-model-file
        continue-on-error: true
        run: gh api "repos/$ISSUE_REPOSITORY/contents/recipe.py?ref=feat/recipe-model" --jq .name

      - name: Check scale.py exists on feat/recipe-scaling
        id: check-scaling-file
        continue-on-error: true
        run: gh api "repos/$ISSUE_REPOSITORY/contents/scale.py?ref=feat/recipe-scaling" --jq .name

      - name: Check scale.py uses the Recipe model from recipe.py
        id: check-scaling-import
        continue-on-error: true
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/$ISSUE_REPOSITORY/contents/scale.py?ref=feat/recipe-scaling" \
            | grep -E '(from|import)[[:space:]]+recipe' > /dev/null

      - name: Check feat/recipe-scaling is stacked on feat/recipe-model
        id: check-order
        continue-on-error: true
        run: |
          status=$(gh api "repos/$ISSUE_REPOSITORY/compare/feat/recipe-model...feat/recipe-scaling" --jq .status)
          echo "Compare status: $status"
          [ "$status" = "ahead" ]

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 2
            results_table:
              - description: "Pushed branch feat/recipe-model containing recipe.py"
                passed: ${{ steps.check-model-file.outcome == 'success' }}
              - description: "Pushed branch feat/recipe-scaling containing scale.py"
                passed: ${{ steps.check-scaling-file.outcome == 'success' }}
              - description: "scale.py imports the Recipe model from recipe.py"
                passed: ${{ steps.check-scaling-import.outcome == 'success' }}
              - description: "feat/recipe-scaling is stacked on top of feat/recipe-model"
                passed: ${{ steps.check-order.outcome == 'success' }}

      # END: Check practical exercise

      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout step content
      actions: write # disable this step and enable the next one
      issues: write # post step content and progress comments
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 3

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_3_FILE }}
          vars: |
            full_repo_name: ${{ github.repository }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "${{github.workflow}}"
          gh workflow enable "Step 3"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
